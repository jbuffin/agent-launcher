[project]
name = "agent-launcher"
version = "0.1.0"
description = "Launch AI coding agents against GitHub issues, PRs and local tasks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jason Buffin", email = "jason@jasonbuffin.dev" }]
keywords = ["ai", "agents", "cli", "git-worktree", "github", "cmux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "questionary>=2.0",
]

[project.scripts]
agent-launcher = "agent_launcher.cli:app"

[project.urls]
Repository = "https://github.com/jbuffin/agent-launcher"
Issues = "https://github.com/jbuffin/agent-launcher/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_launcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
